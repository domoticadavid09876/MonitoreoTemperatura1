<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Monitor Clínico</title>

    <script src="https://www.gstatic.com/firebasejs/9.x/firebase-app-compat.js">
    </script>
    <script src="https://www.gstatic.com/firebasejs/9.x/firebase-database-compat.js">
    </script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(12px);
            border-radius: 30px;
            padding: 40px;
            max-width: 500px;
            width: 100%;
            box-shadow: 0 8px 40px rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        h1 {
            text-align: center;
            color: #fff;
            font-size: 2em;
            font-weight: 300;
            letter-spacing: 2px;
            margin-bottom: 5px;
        }

        h1 span {
            color: #4fc3f7;
            font-weight: 600;
        }

        .subtitle {
            text-align: center;
            color: #888;
            font-size: 0.9em;
            margin-bottom: 30px;
            letter-spacing: 1px;
        }

        .grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 25px;
        }

        .card {
            background: rgba(255, 255, 255, 0.06);
            border-radius: 18px;
            padding: 20px;
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.06);
        }

        .card .icon {
            font-size: 2em;
            display: block;
            margin-bottom: 5px;
        }

        .card .label {
            color: #aaa;
            font-size: 0.7em;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            font-weight: 600;
        }

        .card .value {
            color: #fff;
            font-size: 2.2em;
            font-weight: 700;
            margin-top: 5px;
        }

        .card .value .unit {
            font-size: 0.4em;
            font-weight: 300;
            color: #888;
        }

        .card.temp .value {
            color: #ff6b6b;
        }
        .card.hum .value {
            color: #4ecdc4;
        }

        .btn-alerta {
            width: 100%;
            padding: 18px;
            border: none;
            border-radius: 15px;
            font-size: 18px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            margin-bottom: 20px;
            background: #e2e8f0;
            color: #4a5568;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        }

        .btn-alerta:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 25px rgba(0, 0, 0, 0.3);
        }

        .btn-alerta:active {
            transform: scale(0.96);
        }

        .btn-alerta.activo {
            background: #fc8181;
            color: white;
            animation: pulse 1s infinite;
        }

        @keyframes pulse {
            0%,
            100% {
                opacity: 1;
            }
            50% {
                opacity: 0.6;
            }
        }

        .btn-alerta .icono {
            font-size: 24px;
        }

        .status-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 18px;
            background: rgba(255, 255, 255, 0.04);
            border-radius: 14px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            flex-wrap: wrap;
            gap: 10px;
        }

        .status-bar .status {
            display: flex;
            align-items: center;
            gap: 10px;
            color: #aaa;
            font-size: 0.85em;
        }

        .status-bar .status .dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            display: inline-block;
            animation: pulse 1.5s infinite;
        }

        .status-bar .status .dot.online {
            background: #4ecdc4;
            box-shadow: 0 0 12px rgba(78, 205, 196, 0.4);
        }

        .status-bar .status .dot.offline {
            background: #ff6b6b;
            box-shadow: 0 0 12px rgba(255, 107, 107, 0.4);
            animation: none;
        }

        .status-bar .timestamp {
            color: #666;
            font-size: 0.8em;
            font-weight: 300;
        }

        .footer {
            text-align: center;
            color: #666;
            font-size: 0.8em;
            margin-top: 20px;
            padding-top: 15px;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
        }

        /* DEBUG */
        .debug-box {
            background: rgba(255, 0, 0, 0.1);
            border: 1px solid rgba(255, 0, 0, 0.3);
            border-radius: 10px;
            padding: 10px;
            margin-top: 15px;
            font-family: monospace;
            font-size: 11px;
            color: #ff6b6b;
            max-height: 100px;
            overflow-y: auto;
            display: none;
        }

        .debug-box.show {
            display: block;
        }

        @media (max-width: 480px) {
            .container {
                padding: 25px 18px;
            }
            .grid {
                grid-template-columns: 1fr 1fr;
                gap: 10px;
            }
            .card .value {
                font-size: 1.8em;
            }
            .btn-alerta {
                font-size: 16px;
                padding: 15px;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>🏥 Monitor <span>Clínico</span></h1>
        <p class="subtitle">DHT22 · Temperatura &amp; Humedad</p>

        <button class="btn-alerta" id="btnAlerta">
            <span class="icono">🔊</span>
            <span>ACTIVAR ALERTA</span>
        </button>

        <div class="grid">
            <div class="card temp">
                <span class="icon">🌡️</span>
                <div class="label">Temperatura</div>
                <div class="value" id="tempValue">--<span class="unit">°C</span></div>
            </div>
            <div class="card hum">
                <span class="icon">💧</span>
                <div class="label">Humedad</div>
                <div class="value" id="humValue">--<span class="unit">%</span></div>
            </div>
        </div>

        <div class="status-bar">
            <div class="status">
                <span class="dot online" id="statusDot"></span>
                <span id="statusText">Conectado</span>
            </div>
            <div class="timestamp" id="timestamp">⏳ Esperando datos...</div>
        </div>

        <div class="debug-box" id="debugBox">
            <strong>🔍 DEBUG:</strong><br>
            <span id="debugText">Esperando...</span>
        </div>

        <div class="footer">
            <span>🔊 Alerta sonora: 5 segundos</span>
        </div>
    </div>

    <script>
        // ================================================
        // CONFIGURACIÓN DE FIREBASE (CORRECTA)
        // ================================================
        const firebaseConfig = {
            apiKey: "AIzaSyB9NdqZlkz7kkylnag-gaKEy-R8ju5VKYw",
            authDomain: "monitoreo-b8e27.firebaseapp.com",
            databaseURL: "https://monitoreo-b8e27-default-rtdb.firebaseio.com",
            projectId: "monitoreo-b8e27",
            storageBucket: "monitoreo-b8e27.firebasestorage.app",
            messagingSenderId: "824517081045",
            appId: "1:824517081045:web:e4cb0cedf0a9715ce52f5c"
        };

        // ================================================
        // INICIALIZAR FIREBASE
        // ================================================
        console.log("🚀 Iniciando Firebase...");

        try {
            firebase.initializeApp(firebaseConfig);
            console.log("✅ Firebase inicializado correctamente");
            document.getElementById('statusText').textContent = 'Firebase OK';
        } catch (e) {
            console.error("❌ Error al inicializar Firebase:", e);
            document.getElementById('statusText').textContent = '❌ Error Firebase';
            document.getElementById('debugBox').className = 'debug-box show';
            document.getElementById('debugText').textContent = 'Error: ' + e.message;
        }

        const db = firebase.database();
        const debugBox = document.getElementById('debugBox');
        const debugText = document.getElementById('debugText');

        // ================================================
        // ELEMENTOS HTML
        // ================================================
        const tempEl = document.getElementById('tempValue');
        const humEl = document.getElementById('humValue');
        const timeEl = document.getElementById('timestamp');
        const statusDot = document.getElementById('statusDot');
        const statusText = document.getElementById('statusText');
        const btnAlerta = document.getElementById('btnAlerta');

        // ================================================
        // FUNCIÓN DE DEBUG
        // ================================================
        function showDebug(msg) {
            debugBox.className = 'debug-box show';
            debugText.textContent = msg;
            console.log("🔍 " + msg);
        }

        // ================================================
        // 1. ESCUCHAR DATOS DEL SENSOR
        // ================================================
        const sensorRef = db.ref('/sensores/actual');
        console.log("📡 Escuchando en: /sensores/actual");

        // Primero, leer una vez para ver si hay datos
        sensorRef.once('value', (snapshot) => {
            const data = snapshot.val();
            if (data) {
                showDebug("✅ Datos encontrados: Temp=" + data.temperatura + "°C, Hum=" + data.humedad + "%");
            } else {
                showDebug("⚠️ No hay datos en /sensores/actual");
                showDebug("📌 Verifica que el ESP32 esté enviando datos");
            }
        });

        // Luego, escuchar cambios en tiempo real
        sensorRef.on('value', (snapshot) => {
            const data = snapshot.val();

            if (data) {
                // Mostrar temperatura
                if (data.temperatura !== undefined && data.temperatura !== null) {
                    tempEl.innerHTML = data.temperatura.toFixed(1) + '<span class="unit">°C</span>';
                } else {
                    tempEl.innerHTML = '--<span class="unit">°C</span>';
                }

                // Mostrar humedad
                if (data.humedad !== undefined && data.humedad !== null) {
                    humEl.innerHTML = data.humedad.toFixed(1) + '<span class="unit">%</span>';
                } else {
                    humEl.innerHTML = '--<span class="unit">%</span>';
                }

                // Mostrar timestamp
                if (data.timestamp) {
                    const date = new Date(data.timestamp * 1000);
                    timeEl.textContent = '🕒 ' + date.toLocaleString('es-ES', {
                        day: '2-digit',
                        month: '2-digit',
                        year: 'numeric',
                        hour: '2-digit',
                        minute: '2-digit',
                        second: '2-digit'
                    });
                } else {
                    timeEl.textContent = '🕒 ' + new Date().toLocaleString();
                }

                statusDot.className = 'dot online';
                statusText.textContent = 'Conectado';
                statusText.style.color = '#4ecdc4';

                showDebug("✅ Datos actualizados: Temp=" + data.temperatura + "°C, Hum=" + data.humedad + "%");

            } else {
                tempEl.innerHTML = '--<span class="unit">°C</span>';
                humEl.innerHTML = '--<span class="unit">%</span>';
                timeEl.textContent = '⏳ Esperando datos...';

                statusDot.className = 'dot offline';
                statusText.textContent = 'Sin datos';
                statusText.style.color = '#ff6b6b';

                showDebug("⚠️ No hay datos en Firebase");
            }
        }, (error) => {
            console.error("❌ Error:", error);
            showDebug("❌ Error: " + error.message);
            statusDot.className = 'dot offline';
            statusText.textContent = 'Error';
            statusText.style.color = '#ff6b6b';
        });

        // ================================================
        // 2. ESCUCHAR ESTADO DEL RELÉ
        // ================================================
        const alertaRef = db.ref('/alerta/activa');
        alertaRef.on('value', (snapshot) => {
            const estado = snapshot.val();

            if (estado === true) {
                btnAlerta.className = 'btn-alerta activo';
                btnAlerta.innerHTML = `
                    <span class="icono">🔊</span>
                    <span>ACTIVADO</span>
                `;
                showDebug("🔊 Alerta activada");
            } else if (estado === false) {
                btnAlerta.className = 'btn-alerta';
                btnAlerta.innerHTML = `
                    <span class="icono">🔊</span>
                    <span>ACTIVAR ALERTA</span>
                `;
            }
        });

        // ================================================
        // 3. EVENTO DEL BOTÓN
        // ================================================
        btnAlerta.addEventListener('click', () => {
            showDebug("🔘 Botón presionado, activando alerta...");

            btnAlerta.className = 'btn-alerta activo';
            btnAlerta.innerHTML = `
                <span class="icono">🔊</span>
                <span>ACTIVADO</span>
            `;

            alertaRef.set(true)
                .then(() => {
                    showDebug("✅ Alerta activada en Firebase");
                })
                .catch((error) => {
                    showDebug("❌ Error: " + error.message);
                });
        });

        // ================================================
        // 4. VERIFICAR ESTRUCTURA DE FIREBASE
        // ================================================
        // Verificar si existe la ruta
        db.ref('/').once('value', (snapshot) => {
            const data = snapshot.val();
            if (data) {
                showDebug("📊 Estructura de Firebase: " + JSON.stringify(data).substring(0, 100) + "...");
            } else {
                showDebug("⚠️ No hay datos en la raíz de Firebase");
            }
        });

        console.log('✅ Monitor Web Iniciado!');
        console.log('📡 Conectado a: monitoreo-b8e27');
    </script>

</body>
</html>
