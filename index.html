<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monitor Clínico - DHT22</title>
    <script src="https://www.gstatic.com/firebasejs/9.x/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.x/firebase-database-compat.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .dashboard {
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(12px);
            border-radius: 30px;
            padding: 40px;
            max-width: 600px;
            width: 100%;
            box-shadow: 0 8px 40px rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        h1 {
            text-align: center;
            color: #fff;
            font-size: 2.2em;
            font-weight: 300;
            letter-spacing: 2px;
            margin-bottom: 5px;
        }

        h1 span {
            color: #4fc3f7;
            font-weight: 600;
        }

        .subtitle {
            text-align: center;
            color: #888;
            font-size: 0.9em;
            margin-bottom: 35px;
            letter-spacing: 1px;
        }

        .grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 30px;
        }

        .card {
            background: rgba(255, 255, 255, 0.06);
            border-radius: 18px;
            padding: 25px 20px;
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.06);
        }

        .card .icon {
            font-size: 2.2em;
            display: block;
            margin-bottom: 8px;
        }

        .card .label {
            color: #aaa;
            font-size: 0.75em;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            font-weight: 600;
        }

        .card .value {
            color: #fff;
            font-size: 2.8em;
            font-weight: 700;
            margin-top: 6px;
            line-height: 1.2;
        }

        .card .value .unit {
            font-size: 0.4em;
            font-weight: 300;
            color: #888;
            margin-left: 2px;
        }

        .card.temp .value {
            color: #ff6b6b;
        }

        .card.hum .value {
            color: #4ecdc4;
        }

        .status-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 14px 20px;
            background: rgba(255, 255, 255, 0.04);
            border-radius: 14px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            flex-wrap: wrap;
            gap: 10px;
        }

        .status-bar .status {
            display: flex;
            align-items: center;
            gap: 10px;
            color: #aaa;
            font-size: 0.85em;
        }

        .status-bar .status .dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            display: inline-block;
            animation: pulse 1.5s infinite;
        }

        .status-bar .status .dot.online {
            background: #4ecdc4;
            box-shadow: 0 0 12px rgba(78, 205, 196, 0.4);
        }

        .status-bar .status .dot.offline {
            background: #ff6b6b;
            box-shadow: 0 0 12px rgba(255, 107, 107, 0.4);
            animation: none;
        }

        .status-bar .timestamp {
            color: #666;
            font-size: 0.8em;
            font-weight: 300;
        }

        @keyframes pulse {
            0%,
            100% {
                opacity: 1;
                transform: scale(1);
            }
            50% {
                opacity: 0.6;
                transform: scale(0.9);
            }
        }

        @media (max-width: 480px) {
            .dashboard {
                padding: 25px 18px;
            }
            h1 {
                font-size: 1.6em;
            }
            .card .value {
                font-size: 2em;
            }
            .grid {
                grid-template-columns: 1fr 1fr;
                gap: 12px;
            }
            .status-bar {
                flex-direction: column;
                text-align: center;
            }
        }
    </style>
</head>
<body>
    <div class="dashboard">
        <h1>🏥 Monitor <span>Clínico</span></h1>
        <p class="subtitle">DHT22 · Temperatura &amp; Humedad</p>

        <div class="grid">
            <div class="card temp">
                <span class="icon">🌡️</span>
                <div class="label">Temperatura</div>
                <div class="value" id="tempValue">--<span class="unit">°C</span></div>
            </div>
            <div class="card hum">
                <span class="icon">💧</span>
                <div class="label">Humedad</div>
                <div class="value" id="humValue">--<span class="unit">%</span></div>
            </div>
        </div>

        <div class="status-bar">
            <div class="status">
                <span class="dot online" id="statusDot"></span>
                <span id="statusText">Conectado</span>
            </div>
            <div class="timestamp" id="timestamp">⏳ Esperando datos...</div>
        </div>
    </div>

    <script>
        // =============================================
        // CONFIGURACIÓN DE FIREBASE (TUS CREDENCIALES)
        // =============================================
        const firebaseConfig = {
            apiKey: "AIzaSyB9NdqZlkz7kkylnag-gaKEy-R8ju5VKYw",
            authDomain: "monitoreo-b8e27.firebaseapp.com",
            databaseURL: "https://monitoreo-b8e27-default-rtdb.firebaseio.com",
            projectId: "monitoreo-b8e27",
            storageBucket: "monitoreo-b8e27.firebasestorage.app",
            messagingSenderId: "824517081045",
            appId: "1:824517081045:web:e4cb0cedf0a9715ce52f5c"
        };

        // =============================================
        // INICIALIZAR FIREBASE
        // =============================================
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        // =============================================
        // REFERENCIA A LOS DATOS
        // =============================================
        const sensorRef = db.ref('/sensores/actual');

        // =============================================
        // ELEMENTOS HTML
        // =============================================
        const tempEl = document.getElementById('tempValue');
        const humEl = document.getElementById('humValue');
        const timeEl = document.getElementById('timestamp');
        const statusDot = document.getElementById('statusDot');
        const statusText = document.getElementById('statusText');

        // =============================================
        // ESCUCHAR CAMBIOS EN TIEMPO REAL
        // =============================================
        sensorRef.on('value', (snapshot) => {
            const data = snapshot.val();

            if (data) {
                // Mostrar temperatura
                if (data.temperatura !== undefined && data.temperatura !== null) {
                    tempEl.innerHTML = data.temperatura.toFixed(1) + '<span class="unit">°C</span>';
                } else {
                    tempEl.innerHTML = '--<span class="unit">°C</span>';
                }

                // Mostrar humedad
                if (data.humedad !== undefined && data.humedad !== null) {
                    humEl.innerHTML = data.humedad.toFixed(1) + '<span class="unit">%</span>';
                } else {
                    humEl.innerHTML = '--<span class="unit">%</span>';
                }

                // Mostrar timestamp
                if (data.timestamp) {
                    timeEl.textContent = '🕒 ' + new Date().toLocaleString('es-ES', {
                        day: '2-digit',
                        month: '2-digit',
                        year: 'numeric',
                        hour: '2-digit',
                        minute: '2-digit',
                        second: '2-digit'
                    });
                } else {
                    timeEl.textContent = '🕒 ' + new Date().toLocaleString();
                }

                // Estado: online
                statusDot.className = 'dot online';
                statusText.textContent = 'Conectado';
                statusText.style.color = '#4ecdc4';

                console.log('📊 Datos recibidos:', data);

            } else {
                tempEl.innerHTML = '--<span class="unit">°C</span>';
                humEl.innerHTML = '--<span class="unit">%</span>';
                timeEl.textContent = '⏳ Esperando datos...';

                statusDot.className = 'dot offline';
                statusText.textContent = 'Sin datos';
                statusText.style.color = '#ff6b6b';
            }
        });

        // =============================================
        // MANEJO DE ERRORES DE CONEXIÓN
        // =============================================
        sensorRef.on('canceled', (error) => {
            console.error('Error en Firebase:', error);
            statusDot.className = 'dot offline';
            statusText.textContent = 'Error de conexión';
            statusText.style.color = '#ff6b6b';
            timeEl.textContent = '⚠️ Error al conectar con Firebase';
        });

        console.log('✅ Monitor DHT22 en tiempo real activo');
        console.log('📡 Conectado a: monitoreo-b8e27');
        console.log('🔗 Escuchando en: /sensores/actual');
    </script>
</body>
</html>
